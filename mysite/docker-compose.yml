services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claritydx}
      POSTGRES_USER: ${POSTGRES_USER:-claritydx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claritydx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claritydx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-claritydx}
      POSTGRES_USER: ${POSTGRES_USER:-claritydx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claritydx}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
