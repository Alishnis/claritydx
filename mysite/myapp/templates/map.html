<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearest Hospital</title>
    <script src="https://maps.api.2gis.ru/2.0/loader.js"></script>
    <style>
        #map {
            width: 100%;
            height: 500px;
        }
        #error-message {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
        #hospital-info {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Find the nearest hospital</h1>
    <p id="error-message"></p> <!-- Error message -->
    <div id="map"></div> <!-- Map -->
    <div id="hospital-info"></div> <!-- Nearest hospital info -->
    <script>
        const apiKey = 'a1cdee81-521a-41e7-a0fa-d56f93f3125d'; // Your API key
        let map;

        // Initialize map
        function initializeMap(centerCoordinates) {
            DG.then(function () {
                map = DG.map('map', {
                    center: centerCoordinates,
                    zoom: 14,
                });

                // Add user marker
                DG.marker(centerCoordinates).addTo(map).bindPopup('You are here');
                console.log("Map and user marker created.");
            });
        }

        // Get user geolocation
        navigator.geolocation.getCurrentPosition(
            (position) => {
                console.log("User location obtained:", position);

                const userCoordinates = [position.coords.latitude, position.coords.longitude];

                // Initialize map centered on user location
                initializeMap(userCoordinates);

                // Find nearest hospital
                findNearestHospital(userCoordinates);
            },
            (error) => {
                // Handle geolocation errors
                console.error("Geolocation error:", error.message);

                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = "Unable to determine location. Search cannot be performed.";
            }
        );

        // Find nearest hospital
        function findNearestHospital(coordinates) {
            console.log("Searching nearest hospital for coordinates:", coordinates);

            fetch(`https://catalog.api.2gis.com/3.0/items?key=${apiKey}&q=hospital&type=branch&point=${coordinates[1]},${coordinates[0]}&radius=3000`)
                .then(response => response.json())
                .then(data => {
                    console.log("Full response from 2GIS API:", data);

                    const hospitals = data.result.items;

                    if (!hospitals || hospitals.length === 0) {
                        const errorMessage = document.getElementById('error-message');
                        errorMessage.textContent = "No nearby hospitals found.";
                        return;
                    }

                    // Check nearest hospital data
                    const nearestHospital = hospitals[0];
                    console.log("Nearest hospital data:", nearestHospital);

                    // Render nearest hospital info
                    const hospitalInfo = document.getElementById('hospital-info');
                    hospitalInfo.innerHTML = `
                        <strong>Name:</strong> ${nearestHospital.name} <br>
                        <strong>Address:</strong> ${nearestHospital.address_name || 'Address not available'}
                    `;

                    // If hospital coordinates are available, add it to the map
                    if (nearestHospital.point) {
                        const hospitalCoordinates = [nearestHospital.point.lat, nearestHospital.point.lon];
                        DG.then(function () {
                            DG.marker(hospitalCoordinates)
                                .addTo(map)
                                .bindPopup(`<strong>${nearestHospital.name}</strong><br>${nearestHospital.address_name || 'Address not available'}`);
                            console.log("Nearest hospital marker added to map.");
                        });
                    } else {
                        console.error("Nearest hospital coordinates are missing.");
                    }
                })
                .catch(err => {
                    console.error('Error while searching for nearest hospital:', err);

                    const errorMessage = document.getElementById('error-message');
                    errorMessage.textContent = "An error occurred while connecting to the hospital search API.";
                });
        }
    </script>
</body>
</html>
