{% extends 'base.html' %}
{% load static %}
{% block content %}

<div id="rec843263554" class="r t-rec t-rec_pt_135 t-rec_pt-res-480_90 t-rec_pb_135 t-rec_pb-res-480_90" style="padding-top:135px;padding-bottom:135px;background-color:#fff;" data-animationappear="off" data-record-type="948" data-bg-color="#fff">
    <div class="t948">
        <div class="t-section__container t-container t-container_flex" style="margin-bottom:80px;">
            <div class="t-col t-col_12">
                <div class="t-section__title t-title t-title_xs t-align_center t-margin_auto" field="btitle">
                    Анализ КТ снимков легких
                </div>
                <div class="t-section__descr t-descr t-descr_xl t-align_center t-margin_auto" field="bdescr">
                    с помощью искусственного интеллекта
                </div>
            </div>
        </div
        {% if error %}
    <div style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 20px;">
        <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}
        <div class="t-container">
            <div class="t948__row">
                <div class="t-item t948__col t-col t-col_12">
                    <div class="t948__content">
                        <div class="t948__textwrapper" style="border: 1px solid transparent; background-color: #f2f9fd;">
                            <div class="t948__circle">
                                <div class="t948__number t-name t-name_md">1</div>
                            </div>
                            <div class="t948__title t-name t-name_md" field="li_title__5917094636332">
                                <form action="{% url 'analyze_image2' %}" method="POST" enctype="multipart/form-data" id="uploadForm">
                                    {% csrf_token %}
                                    <label for="file">Выберите файл:</label>
                                    <input type="file" id="file" name="file" accept="image/*" required>
                                    
                                    <div id="preview-container" style="display: none; margin-top: 20px;">
                                        <h5>Предпросмотр изображения</h5>
                                        <img id="preview" class="img-fluid rounded" alt="Preview" style="max-width: 300px; margin: 10px auto;">
                                    </div>

                                    <button type="submit" class="t1001__btn t-btn t-btn_md " style= "color:rgb(0, 0, 0); margin-top: 20px ; font-size: large   ;padding-inline:50px ;display: block;background-color:#88C8E8;border-radius:30px;-moz-border-radius:30px; -webkit-border-radius:30px;" data-buttonfieldset="button">Отправить:</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</div>

<!-- Индикатор загрузки -->
<div id="loading-overlay" style="display: none;">
    <div class="loading-spinner">
        <img src="{% static 'loading.gif' %}" alt="Loading...">
        <p>Анализ...</p>
    </div>
</div>

<style>
    /* Стиль для фона на весь экран */
    #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* Полупрозрачный фон */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000; /* Поверх всего контента */
    }

    /* Стиль для индикатора загрузки */
    .loading-spinner {
        text-align: center;
        color: white;
        font-size: 1.5em;
    }

    .loading-spinner img {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
    }

    #preview-container {
        background-color: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-align: center;
    }

    #preview {
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    button {
        padding: 10px 15px;
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        background-color: #007bff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
        background-color: #0056b3;
        transform: scale(1.05);
    }

    button:focus {
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }
</style>

<script>
    // Функция для отображения индикатора загрузки
    function showLoading() {
        document.getElementById('loading-overlay').style.display = 'flex';
    }

    // Image preview functionality
    document.getElementById('file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview');
                preview.src = e.target.result;
                document.getElementById('preview-container').style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        document.getElementById('loading-overlay').style.display = 'flex';
    });
</script>
{% endblock %}
