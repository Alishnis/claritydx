<!DOCTYPE html>
{% load ui_i18n %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% tr "Analysis Results" %}</title>
    <style>
        .analysis-block {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>{% tr "Analysis Results" %}</h1>
    <button id="add-analysis">{% tr "Add analysis" %}</button>
    <div id="analysis-container"></div>

    <script>
        document.getElementById('add-analysis').addEventListener('click', function () {
            const analysisContainer = document.getElementById('analysis-container');

            // Check if the block exists
            if (!document.querySelector('.analysis-block')) {
                const newBlock = document.createElement('div');
                newBlock.className = 'analysis-block';
                newBlock.textContent = '{% tr "Your analyses:" %}';
                analysisContainer.appendChild(newBlock);
            } else {
                alert('{% tr "You have already checked this scan" %}');
            }
        });
    </script>
</body>
</html>
