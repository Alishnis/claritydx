{% extends 'base.html' %}
{% load static %}

{% block content %}

<div id="rec843263554" class="r t-rec t-rec_pt_135 t-rec_pt-res-480_90 t-rec_pb_135 t-rec_pb-res-480_90" style="padding-top:135px;padding-bottom:135px;background-color:#fff;" data-animationappear="off" data-record-type="948" data-bg-color="#fff">
    <div class="t948">
        <div class="t-section__container t-container t-container_flex" style="margin-bottom:80px;">
            <div class="t-col t-col_12">
                <div class="t-section__title t-title t-title_xs t-align_center t-margin_auto" field="btitle">
                    Blood Cell Analysis
                </div>
                <div class="t-section__descr t-descr t-descr_xl t-align_center t-margin_auto" field="bdescr">
                    with the help of artificial intelligence
                </div>
            </div>
        </div>
        {% if error %}
        <div style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 20px;">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}
        <div class="t-container">
            <div class="t948__row">
                <div class="t-item t948__col t-col t-col_12">
                    <div class="t948__content">
                        <div class="t948__textwrapper" style="border: 1px solid transparent; background-color: #f2f9fd;">
                            <div class="t948__circle">
                                <div class="t948__number t-name t-name_md">1</div>
                            </div>
                            <div class="t948__title t-name t-name_md" field="li_title__5917094636332">
                                <form action="{% url 'upload_image' %}" method="POST" enctype="multipart/form-data" id="uploadForm">
                                    {% csrf_token %}
                                    <label for="image">Select blood cell image:</label>
                                    <input type="file" id="image" name="image" accept="image/*" required>
                                    
                                    <div id="preview-container" style="display: none; margin-top: 20px;">
                                        <h5>Image Preview</h5>
                                        <img id="preview" class="img-fluid rounded" alt="Preview" style="max-width: 300px; margin: 10px auto;">
                                    </div>

                                    <button type="submit" class="t1001__btn t-btn t-btn_md" style="color:rgb(0, 0, 0); margin-top: 20px; font-size: large; padding-inline:50px; display: block; background-color:#88C8E8; border-radius:30px; -moz-border-radius:30px; -webkit-border-radius:30px;" data-buttonfieldset="button">Analyze Image</button>
                                </form>
                                <form action="{% url 'user_kab' %}" method="POST" id="saveForm" style="margin-top: 10px; {% if not show_save_button %}display: none;{% endif %} text-align: center;">
                                    {% csrf_token %}
                                    <button type="submit" class="t1001__btn t-btn t-btn_md" style="color:rgb(0, 0, 0); font-size: large; padding-inline:50px; display: inline-block; background-color:#88C8E8; border-radius:30px; -moz-border-radius:30px; -webkit-border-radius:30px;" data-buttonfieldset="button">Save Results</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Loading Indicator -->
<div id="loading-overlay" style="display: none;">
    <div class="loading-spinner">
        <img src="{% static 'loading.gif' %}" alt="Loading...">
        <p>Analyzing...</p>
    </div>
</div>

<style>
    /* Loading overlay styles */
    #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .loading-spinner {
        text-align: center;
        color: white;
        font-size: 1.5em;
    }

    .loading-spinner img {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
    }


    label {
        
       
        font-size: 1.1em;
    }

    input[type="file"] {
        
        
        padding: 10px;
        
     
        width: 80%; 
        max-width: 400px;
    }

    #preview-container {
        background-color: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #preview {
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    button {
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
        background-color: #6ab0d0 !important;
        transform: scale(1.05);
    }

    button:focus {
        outline: none;
        box-shadow: 0 0 5px rgba(136, 200, 232, 0.5);
    }
</style>

<script>
    document.getElementById('image').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview');
                preview.src = e.target.result;
                document.getElementById('preview-container').style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        document.getElementById('loading-overlay').style.display = 'flex';
    });

    // Show save button when results are available
    {% if show_save_button %}
        document.getElementById('saveForm').style.display = 'block';
    {% endif %}
</script>
{% endblock %}
